<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script>
  // GitHub Pages is case-sensitive, so /p/js4725/ 404s while /p/JS4725/ works.
  // A JUPAS code is "JS" + 4 alphanumerics (SSSDP has letters, e.g. JSSC02). If the
  // 404'd path is a programme code in the wrong case, send it to the canonical
  // uppercase page. Runs before paint (minimal flash) and only redirects when the
  // target differs from the current path, so an invalid code can't loop.
  (function () {
    var m = location.pathname.match(/^\/p\/(js[a-z0-9]{4})\/?$/i);
    if (m) {
      var want = "/p/" + m[1].toUpperCase() + "/";
      if (want !== location.pathname) location.replace(want + location.search + location.hash);
    }
  })();
</script>
<title>找不到頁面 · Page not found | JUPASCal</title>
<meta name="robots" content="noindex, follow" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gelasio:wght@400;600;700&display=swap" />
<style>
  :root{--bg:#f8f0ea;--surface-strong:#fffaf6;--ink:#4d281a;--muted:#786257;--line:#dccabd;--accent:#c2452e}
  @media (prefers-color-scheme:dark){:root{--bg:#11100e;--surface-strong:#22201d;--ink:#eee8dc;--muted:#a59d90;--line:#3a352d;--accent:#d2a86f}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Gelasio','Iowan Old Style',Georgia,serif;line-height:1.6;display:flex;flex-direction:column}
  a{color:var(--accent)}
  .site-header{border-bottom:1px solid var(--line)}
  .site-header .row{max-width:760px;margin:0 auto;padding:11px 20px;display:flex;align-items:center;gap:9px}
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:1.15rem;color:var(--ink);text-decoration:none}
  .brand img{width:26px;height:26px}
  .brand .yr{font-size:.7rem;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:6px;padding:1px 5px}
  main{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:48px 22px;max-width:560px;margin:0 auto}
  .code{font-size:3.4rem;font-weight:700;color:var(--accent);margin:0}
  h1{font-size:1.5rem;margin:6px 0 10px}
  p{color:var(--muted);margin:0 0 22px}
  .btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  .btn{display:inline-block;padding:12px 20px;border-radius:11px;font-weight:700;text-decoration:none}
  .btn.primary{background:var(--accent);color:#fff}
  .btn.ghost{border:1px solid var(--line);color:var(--ink);background:var(--surface-strong)}
</style>
</head>
<body>
<header class="site-header"><div class="row">
  <a class="brand" href="/"><img src="/logo.svg" alt="" /><span>JUPASCal</span><span class="yr">2026</span></a>
</div></header>
<main>
  <p class="code">404</p>
  <h1>找不到頁面 · Page not found</h1>
  <p>此頁面不存在——可能是連結有誤，或課程編號不正確。<br><span lang="en">This page doesn't exist — the link may be mistyped, or the programme code may be wrong.</span></p>
  <div class="btns">
    <a class="btn primary" href="/">打開計算機 · Open the calculator</a>
    <a class="btn ghost" href="/p/">瀏覽所有課程 · Browse all programmes</a>
  </div>
</main>
</body>
</html>
