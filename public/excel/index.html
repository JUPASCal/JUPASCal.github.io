<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Excel 版 | JUPASCal 收生計分器</title>
  <meta name="description" content="JUPASCal Excel 版計分器：全港十間院校收生分數、比重及加分制，可直接輸入試算。" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    :root {
      --bg: #f8f0ea; --surface: #fffaf6; --ink: #2c211c;
      --muted: #8a7a70; --accent: #c2452e; --line: #e7d7cb;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; flex-direction: column;
      background: var(--bg); color: var(--ink);
      font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    header {
      flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 10px clamp(12px,3vw,24px);
      background: var(--surface); border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 9px; min-width: 0; color: var(--ink); }
    .brand .logo-mark { height: 26px; width: auto; flex: 0 0 auto; }
    .brand strong { font-size: 1.06rem; font-weight: 800; letter-spacing: -0.015em; }
    .brand small {
      color: var(--muted); font-size: 0.72rem; font-weight: 650; white-space: nowrap;
      padding: 2px 8px; border: 1px solid var(--line); border-radius: 999px;
    }
    .back {
      flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 13px; border: 1px solid var(--line); border-radius: 999px;
      background: var(--bg); color: var(--ink); font-size: 0.85rem; font-weight: 650;
      text-decoration: none; transition: background .15s, border-color .15s, color .15s;
    }
    .back:hover { background: var(--surface); border-color: var(--accent); color: var(--accent); }
    .notice {
      flex: 0 0 auto; padding: 8px clamp(12px,3vw,24px);
      background: #fdf3e7; border-bottom: 1px solid var(--line);
      color: #7a5a3a; font-size: 0.8rem; line-height: 1.5;
    }
    .notice a { color: var(--accent); font-weight: 650; text-decoration: none; }
    .notice a:hover { text-decoration: underline; }
    main { flex: 1 1 auto; min-height: 0; position: relative; }
    iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); }
    .hint {
      flex: 0 0 auto; padding: 7px clamp(12px,3vw,24px);
      background: var(--surface); border-top: 1px solid var(--line);
      color: var(--muted); font-size: 0.74rem; line-height: 1.6; text-align: center;
    }
    .hint a { color: var(--accent); font-weight: 650; text-decoration: none; }
    .hint a:hover { text-decoration: underline; }
    @media (max-width: 560px) { .brand small { display: none; } }
  </style>
</head>
<body>
  <header>
    <div class="brand">

        <path fill="currentColor" d="M172,33 176,33 312,103 173,172 36,103 171,34Z"/>

        <path fill="#c2922e" d="M293,123 299,126 299,162 291,164 292,124Z"/>
