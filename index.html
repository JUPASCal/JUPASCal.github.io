<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- PWA / Add-to-Home-Screen: launches full-screen (no browser toolbar) on
         iPad/iPhone & Android, which is the only way to get the full viewport
         with no toolbar movement on scroll. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f8f0ea" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="JUPASCal" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <!-- Brand/heading serif. Bundled via Google Fonts so the JUPASCal wordmark
         renders identically on iPad / Android / desktop instead of falling back
         to each platform's own system serif. Gelasio is Georgia-metric-compatible. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gelasio:wght@400;600;700&display=swap" />
    <title>JUPAS Cal 2026</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
